<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Data - UMM Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { primary: '#4f46e5', bg: '#f8fafc', surface: '#ffffff' }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04); }
    .sidebar-gradient { background: linear-gradient(180deg, #4f46e5 0%, #3730a3 100%); }
    .form-input { width: 100%; padding: 14px 20px; background: #fcfdfe; border: 1.5px solid #e2e8f0; border-radius: 16px; color: #1e293b; outline: none; transition: all 0.3s; font-size: 0.9rem; font-weight: 500; }
    .form-input:focus { border-color: #4f46e5; background: #ffffff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
    .form-label { display: block; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: #94a3b8; margin-bottom: 8px; margin-left: 4px; }
    .section-title { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; color: #4f46e5; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 20px; }
  </style>
</head>
<body class="overflow-hidden">

  <div class="flex h-screen w-full p-4 gap-4">
    <!-- Sidebar -->
    <aside class="w-20 hover:w-72 group transition-all duration-500 sidebar-gradient rounded-[32px] flex flex-col py-8 overflow-hidden z-50 shadow-2xl shadow-indigo-500/20">
      <div class="px-6 mb-10 flex items-center gap-4">
        <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center backdrop-blur-md">
          <i data-lucide="zap" class="text-white w-6 h-6 fill-current"></i>
        </div>
        <span class="font-bold text-xl text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">UMM Tracker</span>
      </div>

      <nav class="flex-1 px-4 space-y-2">
        <a href="dashboard.html" class="flex items-center gap-4 p-4 rounded-2xl text-indigo-100 hover:bg-white/10 hover:text-white transition-all group-hover:px-6">
          <i data-lucide="layout-grid" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Statistik</span>
        </a>
        <a href="daftar.html" class="flex items-center gap-4 p-4 rounded-2xl text-indigo-100 hover:bg-white/10 hover:text-white transition-all group-hover:px-6">
          <i data-lucide="users" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Database Alumni</span>
        </a>
        <a href="form.html" class="flex items-center gap-4 p-4 rounded-2xl bg-white/20 text-white transition-all group-hover:px-6">
          <i data-lucide="edit-3" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Input Data</span>
        </a>
        <a href="#" class="flex items-center gap-4 p-4 rounded-2xl text-indigo-100 hover:bg-white/10 hover:text-white transition-all group-hover:px-6">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Security Log</span>
        </a>
      </nav>

      <div class="px-4 mt-auto">
        <button id="logoutBtn" class="w-full flex items-center gap-4 p-4 text-indigo-100 hover:bg-rose-500 hover:text-white rounded-2xl transition-all group-hover:px-6">
          <i data-lucide="power" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col gap-6 overflow-y-auto no-scrollbar">
      <header class="glass-card p-8 rounded-[32px] flex justify-between items-center">
        <div>
          <h1 class="text-3xl font-black text-slate-800 tracking-tight">Profil Lengkap Alumni</h1>
          <p class="text-slate-400 font-medium">Sinkronisasi metadata lulusan dengan basis data pusat</p>
        </div>
        <div class="flex items-center gap-4">
           <a href="index.html" class="flex items-center gap-2 px-6 py-4 rounded-2xl bg-white border border-slate-200 hover:bg-slate-50 transition-all text-slate-600 font-bold text-sm">
             <i data-lucide="home" class="w-5 h-5"></i> Back Home
           </a>
           <div id="importContainer" class="hidden">
             <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden">
             <label for="excelFileInput" class="px-8 py-3 bg-emerald-600 text-white text-sm font-black rounded-2xl cursor-pointer hover:bg-emerald-700 shadow-lg shadow-emerald-100">IMPORT EXCEL</label>
           </div>
        </div>
      </header>

      <form id="alumniForm" class="space-y-6 pb-12">
        <!-- Section 1: Data Pribadi & Akademik -->
        <div class="glass-card rounded-[40px] p-10">
          <h3 class="section-title">Informasi Akademik & Pribadi</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="space-y-1">
              <label class="form-label">Nama Lengkap</label>
              <input type="text" name="namaLulusan" required class="form-input" placeholder="Nama alumni">
            </div>
            <div class="space-y-1">
              <label class="form-label">NIM</label>
              <input type="text" name="nim" required class="form-input" placeholder="Nomor Induk Mahasiswa">
            </div>
            <div class="space-y-1">
              <label class="form-label">Tahun Masuk</label>
              <input type="number" name="tahunMasuk" required class="form-input" placeholder="2021">
            </div>
            <div class="space-y-1">
              <label class="form-label">Tanggal Lulus</label>
              <input type="date" name="tanggalLulus" required class="form-input">
            </div>
            <div class="space-y-1">
              <label class="form-label">Fakultas</label>
              <input type="text" name="fakultas" required class="form-input" placeholder="Fakultas">
            </div>
            <div class="space-y-1">
              <label class="form-label">Program Studi</label>
              <input type="text" name="programStudi" required class="form-input" placeholder="Prodi">
            </div>
            <div class="space-y-1">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-input" placeholder="email@contoh.com">
            </div>
            <div class="space-y-1">
              <label class="form-label">No. HP / WhatsApp</label>
              <input type="text" name="no_hp" class="form-input" placeholder="0812...">
            </div>
            <div class="space-y-1">
              <label class="form-label">Domisili Saat Ini</label>
              <input type="text" name="location" class="form-input" placeholder="Kota / Negara">
            </div>
          </div>
        </div>

        <!-- Section 2: Sosial Media -->
        <div class="glass-card rounded-[40px] p-10">
          <h3 class="section-title">Media Sosial</h3>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="space-y-1">
              <label class="form-label">LinkedIn</label>
              <input type="text" name="linkedin" class="form-input" placeholder="linkedin.com/in/...">
            </div>
            <div class="space-y-1">
              <label class="form-label">Instagram</label>
              <input type="text" name="instagram" class="form-input" placeholder="@username">
            </div>
            <div class="space-y-1">
              <label class="form-label">Facebook</label>
              <input type="text" name="facebook" class="form-input" placeholder="fb.com/...">
            </div>
            <div class="space-y-1">
              <label class="form-label">TikTok</label>
              <input type="text" name="tiktok" class="form-input" placeholder="@username">
            </div>
          </div>
        </div>

        <!-- Section 3: Data Karir & Pekerjaan -->
        <div class="glass-card rounded-[40px] p-10">
          <h3 class="section-title">Karir & Pekerjaan</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="space-y-1">
              <label class="form-label">Jenis Instansi</label>
              <select name="category" class="form-input">
                <option value="PNS">PNS / ASN</option>
                <option value="Swasta">Swasta</option>
                <option value="Wirausaha">Wirausaha</option>
                <option value="Belum Bekerja">Belum Bekerja</option>
              </select>
            </div>
            <div class="space-y-1">
              <label class="form-label">Jabatan / Posisi</label>
              <input type="text" name="job" class="form-input" placeholder="Contoh: Manager">
            </div>
            <div class="space-y-1">
              <label class="form-label">Nama Tempat Bekerja</label>
              <input type="text" name="company" class="form-input" placeholder="Nama Perusahaan">
            </div>
            <div class="space-y-1 md:col-span-2">
              <label class="form-label">Alamat Tempat Bekerja</label>
              <input type="text" name="work_address" class="form-input" placeholder="Alamat lengkap kantor">
            </div>
            <div class="space-y-1">
              <label class="form-label">Sosmed Tempat Bekerja</label>
              <input type="text" name="work_social" class="form-input" placeholder="IG/LinkedIn Kantor">
            </div>
          </div>
        </div>

        <!-- Section 4: Status Verifikasi -->
        <div class="glass-card rounded-[40px] p-10">
          <h3 class="section-title">Status Verifikasi Data</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
             <label class="flex items-center gap-4 p-5 bg-slate-50 border-2 border-transparent rounded-[24px] cursor-pointer hover:bg-white hover:border-indigo-600 transition-all group">
                <input type="radio" name="status" value="Teridentifikasi" class="w-5 h-5 accent-indigo-600">
                <span class="text-sm font-black text-slate-600 group-hover:text-indigo-600 transition-colors uppercase tracking-widest">TERIDENTIFIKASI</span>
             </label>
             <label class="flex items-center gap-4 p-5 bg-slate-50 border-2 border-transparent rounded-[24px] cursor-pointer hover:bg-white hover:border-indigo-600 transition-all group">
                <input type="radio" name="status" value="Perlu Verifikasi" class="w-5 h-5 accent-indigo-600">
                <span class="text-sm font-black text-slate-600 group-hover:text-indigo-600 transition-colors uppercase tracking-widest">PERLU VERIFIKASI</span>
             </label>
             <label class="flex items-center gap-4 p-5 bg-slate-50 border-2 border-transparent rounded-[24px] cursor-pointer hover:bg-white hover:border-indigo-600 transition-all group">
                <input type="radio" name="status" value="Belum Dilacak" checked class="w-5 h-5 accent-indigo-600">
                <span class="text-sm font-black text-slate-600 group-hover:text-indigo-600 transition-colors uppercase tracking-widest">BELUM DILACAK</span>
             </label>
          </div>
          
          <div class="pt-10">
            <button type="submit" id="submitBtn" class="w-full py-6 bg-indigo-600 text-white font-black text-xl rounded-[32px] shadow-2xl shadow-indigo-200 hover:bg-indigo-700 transition-all active:scale-[0.98] uppercase tracking-widest">
              SIMPAN SELURUH DATA ALUMNI
            </button>
          </div>
        </div>
      </form>
      <p id="statusMessage" class="mt-8 text-center text-slate-400 font-black text-xs uppercase tracking-[0.2em] pb-12"></p>
    </main>
  </div>

  <script src="script.js"></script>
  <script>
    lucide.createIcons();
    const userRole = localStorage.getItem("userRole");
    if (userRole === "viewer") {
      window.location.href = "daftar.html";
    } else if (userRole !== "admin") {
      window.location.href = "index.html";
    }
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('adminLogin');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
