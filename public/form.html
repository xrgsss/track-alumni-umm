<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Data - UMM Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { primary: '#4f46e5', bg: '#f8fafc', surface: '#ffffff' }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04); }
    .sidebar-gradient { background: linear-gradient(180deg, #4f46e5 0%, #3730a3 100%); }
    .form-input { width: 100%; padding: 16px 24px; background: #fcfdfe; border: 1.5px solid #e2e8f0; border-radius: 20px; color: #1e293b; outline: none; transition: all 0.3s; font-size: 0.95rem; font-weight: 500; }
    .form-input:focus { border-color: #4f46e5; background: #ffffff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
    .form-label { display: block; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: #94a3b8; margin-bottom: 10px; margin-left: 4px; }
  </style>
</head>
<body class="overflow-hidden">

  <div class="flex h-screen w-full p-4 gap-4">
    <!-- Sidebar -->
    <aside class="w-20 hover:w-72 group transition-all duration-500 sidebar-gradient rounded-[32px] flex flex-col py-8 overflow-hidden z-50 shadow-2xl shadow-indigo-500/20">
      <div class="px-6 mb-10 flex items-center gap-4">
        <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center backdrop-blur-md">
          <i data-lucide="zap" class="text-white w-6 h-6 fill-current"></i>
        </div>
        <span class="font-bold text-xl text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">UMM Tracker</span>
      </div>

      <nav class="flex-1 px-4 space-y-2">
        <a href="dashboard.html" class="flex items-center gap-4 p-4 rounded-2xl text-indigo-100 hover:bg-white/10 hover:text-white transition-all group-hover:px-6">
          <i data-lucide="layout-grid" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Statistik</span>
        </a>
        <a href="daftar.html" class="flex items-center gap-4 p-4 rounded-2xl text-indigo-100 hover:bg-white/10 hover:text-white transition-all group-hover:px-6">
          <i data-lucide="users" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Database Alumni</span>
        </a>
        <a href="form.html" class="flex items-center gap-4 p-4 rounded-2xl bg-white/20 text-white transition-all group-hover:px-6">
          <i data-lucide="edit-3" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Input Data</span>
        </a>
        <a href="#" class="flex items-center gap-4 p-4 rounded-2xl text-indigo-100 hover:bg-white/10 hover:text-white transition-all group-hover:px-6">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Security Log</span>
        </a>
      </nav>

      <div class="px-4 mt-auto">
        <button id="logoutBtn" class="w-full flex items-center gap-4 p-4 text-indigo-100 hover:bg-rose-500 hover:text-white rounded-2xl transition-all group-hover:px-6">
          <i data-lucide="power" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col gap-6 overflow-y-auto no-scrollbar">
      <header class="glass-card p-10 rounded-[40px] flex justify-between items-center">
        <div>
          <h1 class="text-4xl font-black text-slate-800 tracking-tight">Input Profil Alumni</h1>
          <p class="text-slate-400 font-medium">Lengkapi metadata lulusan untuk sinkronisasi sistem</p>
        </div>
        <div class="flex items-center gap-4">
           <a href="index.html" class="flex items-center gap-2 px-6 py-4 rounded-2xl bg-white border border-slate-200 hover:bg-slate-50 transition-all text-slate-600 font-bold text-sm">
             <i data-lucide="home" class="w-5 h-5"></i>
             Back Home
           </a>
           <div id="importContainer" class="hidden">
           <div class="flex items-center gap-4 bg-emerald-50 p-3 rounded-[24px] border border-emerald-100">
              <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden">
              <label for="excelFileInput" class="px-8 py-3 bg-emerald-600 text-white text-sm font-black rounded-2xl cursor-pointer hover:bg-emerald-700 transition-all shadow-lg shadow-emerald-100">IMPORT EXCEL</label>
              <a href="template.csv" download class="text-emerald-700 text-xs font-black mr-4 flex items-center gap-2 hover:opacity-70 transition-all">
                <i data-lucide="download" class="w-4 h-4"></i> TEMPLATE
              </a>
           </div>
        </div>
      </header>

      <div class="glass-card rounded-[40px] p-12 shadow-2xl shadow-slate-200/40">
        <form id="alumniForm" class="grid grid-cols-1 md:grid-cols-3 gap-10">
          <div class="space-y-1">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" name="namaLulusan" required class="form-input" placeholder="Masukkan nama alumni">
          </div>
          <div class="space-y-1">
            <label class="form-label">NIM Mahasiswa</label>
            <input type="text" name="nim" required class="form-input" placeholder="Contoh: 202110370311001">
          </div>
          <div class="space-y-1">
            <label class="form-label">Tahun Masuk</label>
            <input type="number" name="tahunMasuk" required class="form-input" placeholder="Tahun angkatan">
          </div>
          <div class="space-y-1">
            <label class="form-label">Tanggal Kelulusan</label>
            <input type="date" name="tanggalLulus" required class="form-input">
          </div>
          <div class="space-y-1">
            <label class="form-label">Fakultas</label>
            <input type="text" name="fakultas" required class="form-input" placeholder="Nama Fakultas">
          </div>
          <div class="space-y-1">
            <label class="form-label">Program Studi</label>
            <input type="text" name="programStudi" required class="form-input" placeholder="Nama Prodi">
          </div>
          <div class="space-y-1">
            <label class="form-label">Jabatan Pekerjaan</label>
            <input type="text" name="job" required class="form-input" placeholder="Posisi saat ini">
          </div>
          <div class="space-y-1">
            <label class="form-label">Instansi / Perusahaan</label>
            <input type="text" name="company" required class="form-input" placeholder="Tempat bekerja">
          </div>
          <div class="space-y-1">
            <label class="form-label">Lokasi Domisili</label>
            <input type="text" name="location" required class="form-input" placeholder="Kota / Negara">
          </div>
          
          <div class="md:col-span-3 py-4">
            <label class="form-label">Status Verifikasi Data</label>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
               <label class="flex items-center gap-4 p-5 bg-slate-50 border-2 border-transparent rounded-[24px] cursor-pointer hover:bg-white hover:border-indigo-600 transition-all group">
                  <input type="radio" name="status" value="Teridentifikasi" class="w-5 h-5 accent-indigo-600">
                  <span class="text-sm font-black text-slate-600 group-hover:text-indigo-600 transition-colors">TERIDENTIFIKASI</span>
               </label>
               <label class="flex items-center gap-4 p-5 bg-slate-50 border-2 border-transparent rounded-[24px] cursor-pointer hover:bg-white hover:border-indigo-600 transition-all group">
                  <input type="radio" name="status" value="Perlu Verifikasi" class="w-5 h-5 accent-indigo-600">
                  <span class="text-sm font-black text-slate-600 group-hover:text-indigo-600 transition-colors">PERLU VERIFIKASI</span>
               </label>
               <label class="flex items-center gap-4 p-5 bg-slate-50 border-2 border-transparent rounded-[24px] cursor-pointer hover:bg-white hover:border-indigo-600 transition-all group">
                  <input type="radio" name="status" value="Belum Dilacak" checked class="w-5 h-5 accent-indigo-600">
                  <span class="text-sm font-black text-slate-600 group-hover:text-indigo-600 transition-colors">BELUM DILACAK</span>
               </label>
            </div>
          </div>

          <div class="md:col-span-3 pt-6">
            <button type="submit" id="submitBtn" class="w-full py-6 bg-indigo-600 text-white font-black text-xl rounded-[32px] shadow-2xl shadow-indigo-200 hover:bg-indigo-700 transition-all active:scale-[0.98] uppercase tracking-widest">
              SIMPAN PERUBAHAN DATA
            </button>
          </div>
        </form>
        <p id="statusMessage" class="mt-8 text-center text-slate-400 font-black text-xs uppercase tracking-[0.2em]"></p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
  <script>
    lucide.createIcons();
    if (localStorage.getItem("adminLogin") !== "true") window.location.href = "index.html";
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('adminLogin');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
