<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Alumni - UMM Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { primary: '#4f46e5', bg: '#f8fafc', surface: '#ffffff' }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04); }
    .sidebar-gradient { background: linear-gradient(180deg, #4f46e5 0%, #3730a3 100%); }
    .status-pill { display: inline-flex; padding: 6px 16px; border-radius: 100px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    .status-identified { background: #ecfdf5; color: #059669; border: 1px solid #d1fae5; }
    .status-verify { background: #fffbeb; color: #d97706; border: 1px solid #fef3c7; }
    .status-untracked { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
    
    /* Visitor Mode Tweaks */
    body.is-visitor aside { display: none !important; }
    body.is-visitor main { padding-left: 2rem; padding-right: 2rem; }
    body.is-visitor .admin-only { display: none !important; }
  </style>
</head>
<body class="overflow-hidden">
  <script>
    // Immediate Role Check
    (function() {
      const role = localStorage.getItem("userRole");
      console.log("Current Role:", role);
      if (!role || role === "viewer") {
        document.body.classList.add("is-visitor");
      }
    })();
  </script>

  <div class="flex h-screen w-full p-4 gap-4">
    <!-- Sidebar -->
    <aside class="w-20 hover:w-72 group transition-all duration-500 sidebar-gradient rounded-[32px] flex flex-col py-8 overflow-hidden z-50 shadow-2xl shadow-indigo-500/20">
      <div class="px-6 mb-10 flex items-center gap-4">
        <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center backdrop-blur-md">
          <i data-lucide="zap" class="text-white w-6 h-6 fill-current"></i>
        </div>
        <span class="font-bold text-xl text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">UMM Tracker</span>
      </div>

      <nav class="flex-1 px-4 space-y-2">
        <a href="dashboard.html" class="flex items-center gap-4 p-4 rounded-2xl text-indigo-100 hover:bg-white/10 hover:text-white transition-all group-hover:px-6">
          <i data-lucide="layout-grid" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Statistik</span>
        </a>
        <a href="daftar.html" class="flex items-center gap-4 p-4 rounded-2xl bg-white/20 text-white transition-all group-hover:px-6">
          <i data-lucide="users" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Database Alumni</span>
        </a>
        <a href="form.html" class="flex items-center gap-4 p-4 rounded-2xl text-indigo-100 hover:bg-white/10 hover:text-white transition-all group-hover:px-6">
          <i data-lucide="edit-3" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Input Data</span>
        </a>
        <a href="#" class="flex items-center gap-4 p-4 rounded-2xl text-indigo-100 hover:bg-white/10 hover:text-white transition-all group-hover:px-6">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Security Log</span>
        </a>
      </nav>

      <div class="px-4 mt-auto">
        <button id="logoutBtn" class="w-full flex items-center gap-4 p-4 text-indigo-100 hover:bg-rose-500 hover:text-white rounded-2xl transition-all group-hover:px-6">
          <i data-lucide="power" class="w-6 h-6"></i>
          <span class="font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col gap-6 overflow-y-auto no-scrollbar">
      <header class="flex flex-col md:flex-row justify-between items-start md:items-center glass-card p-10 rounded-[40px] gap-8">
        <div>
          <h1 class="text-4xl font-black text-slate-800 tracking-tight">Database Alumni</h1>
          <p class="text-slate-400 font-medium">Manajemen data lulusan UMM tingkat universitas</p>
        </div>
        <div class="flex items-center gap-4">
           <a href="index.html" class="flex items-center gap-2 px-6 py-4 rounded-2xl bg-white border border-slate-200 hover:bg-slate-50 transition-all text-slate-600 font-bold text-sm">
             <i data-lucide="home" class="w-5 h-5"></i> Back Home
           </a>
           <button id="headerLogoutBtn" class="hidden flex items-center gap-2 px-6 py-4 rounded-2xl bg-rose-50 text-rose-600 border border-rose-100 hover:bg-rose-100 transition-all font-bold text-sm">
             <i data-lucide="power" class="w-5 h-5"></i> Logout
           </button>
           <div class="flex items-center relative">
             <i data-lucide="search" class="absolute left-6 text-slate-400 w-5 h-5"></i>
             <input type="text" id="searchName" placeholder="Cari alumni..." class="w-72 pl-14 pr-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all font-bold text-sm">
           </div>
           <button id="searchBtn" class="px-8 py-4 bg-indigo-600 text-white font-black rounded-2xl hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-100 active:scale-95 uppercase tracking-widest text-xs">Cari</button>
           <button id="resetBtn" class="p-4 bg-white border border-slate-200 rounded-[20px] hover:bg-slate-50 transition-all text-slate-400">
             <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
           </button>
        </div>
      </header>

      <div class="glass-card rounded-[40px] overflow-hidden flex-1 flex flex-col shadow-xl shadow-slate-200/50">
        <div class="overflow-x-auto flex-1">
          <table id="alumniTable" class="w-full text-left">
            <thead>
              <tr class="bg-slate-50/50 border-b border-slate-100">
                <th class="px-10 py-6 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Data Alumni</th>
                <th class="px-10 py-6 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Akademik</th>
                <th class="px-10 py-6 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Karir</th>
                <th class="px-10 py-6 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Verifikasi</th>
                <th class="px-10 py-6 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] text-right admin-only">Tindakan</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
              <!-- JS Injected -->
            </tbody>
          </table>
        </div>
        <div id="paginationControls" class="p-8 bg-slate-50/30 flex items-center justify-between border-t border-slate-100"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
  <script>
    lucide.createIcons();
    
    // Role-based UI logic
    const userRole = localStorage.getItem("userRole");
    const isAdmin = userRole === "admin";
    const isViewer = userRole === "viewer";
    const isGuest = !userRole;

    if (userRole !== "admin") {
      document.body.classList.add("is-visitor");
    }
    
    // Show header logout for viewer (since sidebar is hidden)
    if (isViewer) {
       const headerLogout = document.getElementById("headerLogoutBtn");
       if (headerLogout) headerLogout.classList.remove("hidden");
    }

    const logoutHandler = () => {
      localStorage.removeItem('adminLogin');
      localStorage.removeItem('userRole');
      window.location.href = 'index.html';
    };

    if (document.getElementById('logoutBtn')) document.getElementById('logoutBtn').addEventListener('click', logoutHandler);
    if (document.getElementById('headerLogoutBtn')) document.getElementById('headerLogoutBtn').addEventListener('click', logoutHandler);
  </script>
</body>
</html>
